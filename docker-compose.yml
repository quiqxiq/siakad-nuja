services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siakad_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=siakad_nuja
      - DB_USERNAME=siakad_user
      - DB_PASSWORD=siakad_secret
      - WHATSAPP_WEB_HOST=127.0.0.1
      - WHATSAPP_WEB_PORT=3000
      - WHATSAPP_WEB_NODE_BINARY=/usr/bin/node
      - WHATSAPP_WEB_NPM_BINARY=/usr/bin/npm
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - .:/var/www/html:z
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro,z
      - ./docker/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro,z
    ports:
      - "3001:3000"
      - "5174:5173"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siakad-net

  web:
    image: docker.io/library/nginx:alpine
    container_name: siakad_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - app
    networks:
      - siakad-net

  db:
    image: docker.io/library/mariadb:11.4
    container_name: siakad_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: siakad_nuja
      MYSQL_USER: siakad_user
      MYSQL_PASSWORD: siakad_secret
      MYSQL_ROOT_PASSWORD: siakad_root_secret
    ports:
      - "3307:3306"
    volumes:
      - siakad_db_data:/var/lib/mysql:z
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -psiakad_root_secret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - siakad-net

  redis:
    image: docker.io/library/redis:alpine
    container_name: siakad_redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - siakad_redis_data:/data:z
    networks:
      - siakad-net

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: siakad_tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./docker/cloudflared/config.yml:/etc/cloudflared/config.yml:ro,z
      - /home/quixiq/.cloudflared/eead279d-e08e-4782-a358-64a03826970f.json:/etc/cloudflared/credentials.json:ro,z
    depends_on:
      - web
    networks:
      - siakad-net

networks:
  siakad-net:
    driver: bridge

volumes:
  siakad_db_data:
  siakad_redis_data:
